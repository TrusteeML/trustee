name: Docs

on:
    push:
        branches: [master]
    pull_request:
    workflow_dispatch:

concurrency:
    group: docs-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build docs
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: docs/requirements.txt

            # sphinx-gallery executes examples/, which render trees through `dot`.
            - name: Install Graphviz
              run: sudo apt-get update && sudo apt-get install -y graphviz

            - name: Install documentation dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r docs/requirements.txt

            - name: Build HTML
              # -W turns warnings into errors so broken references fail the build.
              env:
                  MPLBACKEND: Agg
              run: python -m sphinx -b html -W --keep-going docs docs/build/html

            - uses: actions/upload-artifact@v7
              with:
                  name: html-docs
                  path: docs/build/html/

            - name: Deploy
              # Only publish from master, never from a pull request.
              if: github.event_name == 'push' && github.ref == 'refs/heads/master'
              uses: peaceiris/actions-gh-pages@v4
              with:
                  deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
                  external_repository: TrusteeML/trusteeml.github.io
                  publish_dir: docs/build/html
